name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]" "setuptools>=75" wheel
      - run: python scripts/build_release.py
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 dist/latest.json \
            --title "Study Retriever ${GITHUB_REF_NAME#v}" \
            --notes "Windows ZIP, SHA-256 checksum and update feed. Install with install.cmd; see the README."
